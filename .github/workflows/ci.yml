# Every push and pull request: static checks and unit tests in Windows PowerShell 5.1 with Pester 3.4.0, the
# launcher scenarios against FakeVL, and the real installation as administrator (the runner is one): Program
# Files, permissions, event log, rc10 forwarders, a package signed with a throwaway certificate, update, removal.
# Actions are pinned to commits; the comment names the version.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pester 3.4.0
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'3.4.0' })) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
            Install-Module Pester -RequiredVersion 3.4.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Static checks and unit tests
        shell: powershell
        run: .\tests\Run-Tests.ps1 -Static -Unit

      - name: Launcher scenarios against FakeVL
        if: success() || failure()
        shell: powershell
        run: .\tests\Run-Tests.ps1 -Launcher

      - name: Installation as administrator
        if: success() || failure()
        shell: powershell
        run: .\tests\ci\Test-Installation.ps1

      - name: Test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            tests/_work/
            dist/SHA256SUMS*.txt
          if-no-files-found: ignore
