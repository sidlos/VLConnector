# A tag v<VERSION> (e.g. v1.0.0-rc11) builds the release package from the tagged commit with
# tools\Build-Release.ps1 (committed files only), creates the GitHub release with the ZIP and SHA256SUMS.txt
# (the ZIP's SHA-256 and the package fingerprint Install.cmd shows) and a build attestation: GitHub signs which
# repository, workflow and commit built the ZIP (check it: gh attestation verify <zip> --repo <owner>/<repo>).
# The attestation is made for a public repository; a private one needs GitHub Enterprise Cloud for it and the
# repository variable VLC_ATTESTATION = 'true'. No personal code signature is involved; IT can sign with
# tools\Sign-Package.ps1.
# Actions are pinned to commits; the comment names the version.
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pester 3.4.0
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'3.4.0' })) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
            Install-Module Pester -RequiredVersion 3.4.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Static checks and unit tests
        shell: powershell
        run: .\tests\Run-Tests.ps1 -Static -Unit

      - name: The tag names the version
        shell: powershell
        run: |
          $version = ([IO.File]::ReadAllText('VERSION')).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version." }

      - name: Package
        shell: powershell
        run: .\tools\Build-Release.ps1

      - name: Build attestation
        if: ${{ !github.event.repository.private || vars.VLC_ATTESTATION == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([IO.File]::ReadAllText('VERSION')).Trim()
          $changelog = [IO.File]::ReadAllText('CHANGELOG.md') -replace "`r`n", "`n"
          $section = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($version))\b.*?(?=^## |\z)")
          $notes = if ($section.Success) { $section.Value.Trim() } else { "VL Connector for PolyWorks $version" }
          $notes += "`n`nCheck the download: SHA256SUMS.txt holds the SHA-256 of the ZIP and the package fingerprint that Install.cmd shows."
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.md", $notes)
          $zip = (Get-ChildItem dist\*.zip | Select-Object -First 1).FullName
          $arguments = @('release', 'create', $env:GITHUB_REF_NAME, $zip, 'dist\SHA256SUMS.txt', '--title', "VL Connector $version", '--notes-file', "$env:RUNNER_TEMP\notes.md", '--verify-tag')
          if ($version -match '-') { $arguments += '--prerelease' }
          gh @arguments
